name: CI & Quality Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emoji-lint:
    name: Global Design System (Emoji Linter)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Zero-Emoji Linter
        run: python scripts/lint_emojis.py

  backend:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    needs: emoji-lint
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: test-secret-key-for-github-actions-ci-never-use-in-prod
      ENCRYPTION_KEY: test-secret-key-for-github-actions-ci-never-use-in-prod
      CELERY_TASK_ALWAYS_EAGER: "True"
      LLM_PROVIDER: "mock"
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite with Coverage
        working-directory: ./backend
        run: |
          pytest tests/ --cov=apps --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml

  frontend:
    name: Frontend Typecheck & Vitest
    runs-on: ubuntu-latest
    needs: emoji-lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: TypeScript Check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run Vitest Suite
        working-directory: ./frontend
        run: npm test
